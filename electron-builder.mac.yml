appId: com.cyrene.live2d
productName: Cyrene
artifactName: Cyrene-${version}-mac-${arch}.${ext}
directories:
  output: release
asar: true
asarUnpack:
  - "**/vendor/srt-win/**"
  - "**/node_modules/@ast-grep/**"
  - "**/node_modules/@playwright/**"
  - "**/node_modules/playwright/**"
  - "**/node_modules/playwright-core/**"
electronDist: node_modules/electron/dist
files:
  - dist/**/*
  - "!dist/components/**/*"
  - package.json
  - assets/**/*
  - vendor/**/*
  - "!vendor/cloud-music-mcp/**/*"
  - "!vendor/cyrene-skills/**/*"
  - "!models/**/*"
extraFiles:
  - from: prompts
    to: prompts
  - from: skills
    to: skills
extraResources:
  - from: resources/components
    to: components
  - from: vendor/cyrene-skills
    to: cyrene-skills
mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  minimumSystemVersion: "11.0"
  extendInfo:
    NSMicrophoneUsageDescription: Cyrene 使用麦克风以支持语音通话与语音输入功能。
afterSign: build/notarize.mac.js
dmg:
  artifactName: Cyrene-${version}-${arch}.${ext}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
