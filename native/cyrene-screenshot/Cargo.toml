[package]
name = "cyrene-screenshot"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
uuid = { version = "1.24.0", features = ["v4"] }
png = "0.18.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Performance", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
windows-numerics = "0.3.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.1", features = ["NSString", "NSGeometry", "NSArray", "NSDictionary", "NSData", "NSValue", "NSAttributedString", "NSRunLoop", "NSThread", "NSTimer", "NSDate", "NSObjCRuntime"] }
objc2-app-kit = { version = "0.3.1", features = ["NSApplication", "NSWindow", "NSPanel", "NSView", "NSScreen", "NSEvent", "NSResponder", "NSPasteboard", "NSColor", "NSBezierPath", "NSImage", "NSImageRep", "NSGraphicsContext", "NSGraphics", "NSCursor", "NSStringDrawing", "NSAttributedString", "objc2-core-graphics", "objc2-core-foundation"] }
objc2-core-graphics = "0.3.1"
objc2-core-foundation = { version = "0.3.1", features = ["CFCGTypes", "CFArray", "CFDictionary", "CFString", "CFNumber", "CFData"] }
libc = "0.2.189"

[dev-dependencies]
serial_test = "3.5.0"
